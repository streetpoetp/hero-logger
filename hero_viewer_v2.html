<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hero.LogViewer</title>
    <style>
        :root {
            --bg-deep-blue: #0d1b2a;
            --bg-mid-blue: #1b263b;
            --bg-light-blue: #2a3a50;
            --text-cream: #e0e1dd;
            --accent-cyan: #61dafb;
            --accent-yellow: #f7b801;
            --accent-red: #f45b69;
            --accent-gray: #778da9;
            --accent-lavender: #b39ddb;
            --accent-teal: #80cbc4;
        }

        body {
            margin: 0; background: var(--bg-deep-blue); color: var(--text-cream);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px; display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* Dark Scrollbar */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-mid-blue); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--bg-light-blue);
            border-radius: 6px;
            border: 2px solid var(--bg-mid-blue);
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #4a5a70; }

        .split-container {
            display: flex; flex-direction: column; flex: 1; min-height: 0;
        }

        .view-pane {
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        #mainView { flex: 1 1 50%; }
        #filterView { flex: 1 1 50%; background: var(--bg-mid-blue); }

        /* Toolbar nested inside Filter View */
        .toolbar {
            height: 32px; background: var(--bg-mid-blue); display: flex; align-items: center;
            gap: 8px; padding: 0 8px; border-bottom: 1px solid #000; flex-shrink: 0;
            z-index: 20;
        }

        /* Editor containers within panes */
        .editor-container { flex: 1; width: 100%; min-height: 0; }

        button, input, select {
            background: var(--bg-light-blue); color: var(--text-cream); border: 1px solid #000;
            padding: 4px 8px; border-radius: 2px; font-family: inherit; font-size: 11px;
        }
        input:focus { outline: 1px solid var(--accent-cyan); }
        #parserTemplate { width: 300px; }
        #searchInput { flex-grow: 1; }
        #searchInput.active-filter { color: var(--accent-cyan); font-weight: bold; }

        .splitter {
            height: 8px; background: #000; cursor: row-resize; flex-shrink: 0;
            transition: background 0.2s; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .splitter::after {
            content: "•••"; color: var(--accent-gray); letter-spacing: 2px; font-size: 10px;
        }
        .splitter:hover, .splitter.dragging {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>

<div class="split-container" id="splitContainer">
    <!-- Top Pane: Full Log -->
    <div id="mainView" class="view-pane">
        <div id="mainEditorContainer" class="editor-container"></div>
    </div>

    <!-- Drag Handle -->
    <div class="splitter" id="splitter"></div>

    <!-- Bottom Pane: Filter & Controls -->
    <div id="filterView" class="view-pane">
        <div class="toolbar">
            <input type="file" id="fileInput">
            <input id="parserTemplate" value="${timestamp} [${level}] [${thread}] ${logger} ${message}" title="Log Parser Template">
            <input id="searchInput" placeholder="Filter regex (e.g. ERROR or /ERROR|WARN/i) + Enter">
        </div>
        <div id="filterEditorContainer" class="editor-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs/loader.js"></script>

<script>
    let mainEditor;
    let filterEditor;
    let rawLogLines = [];
    let filteredDataMap = []; 
    let isSyncing = false; 
    let languageCounter = 0;
    let currentLanguageId = 'hero-log-0';

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        
        monaco.editor.defineTheme('heroDark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
                { token: 'log-part-timestamp', foreground: '888888' },
                { token: 'log-part-thread', foreground: 'ffaaaa' },
                { token: 'log-part-logger', foreground: 'aaaaff' },
                { token: 'log-level-error', foreground: 'ff5555', fontStyle: 'bold' },
                { token: 'log-level-warn', foreground: 'ffaa00', fontStyle: 'bold' },
                { token: 'log-level-info', foreground: '55ffff' },
                { token: 'log-level-debug', foreground: '55ff55' },
                { token: 'log-level-trace', foreground: 'ff55ff' },
                { token: 'log-part-level', foreground: 'ffffff' },
                { token: 'log-part-message', foreground: 'e0e1dd' },
                { token: 'log-literal', foreground: '555555' }
            ],
            colors: {
                'editor.background': '#0d1b2a',
                'editor.foreground': '#e0e1dd',
                'editorCursor.foreground': '#61dafb',
                
                // ENHANCED HIGHLIGHTING
                'editor.lineHighlightBackground': '#61dafb25', // Subtle cyan tint
                'editor.lineHighlightBorder': '#61dafb66',     // Visible cyan border "glow"
                'editor.selectionBackground': '#2a3a50aa',
                'editor.selectionHighlightBackground': '#61dafb44',
                
                'editorWidget.background': '#1b263b',
                'editorWidget.border': '#61dafb',
                'scrollbarSlider.background': '#2a3a50',
                'scrollbarSlider.hoverBackground': '#4a5a70',
            }
        });
        monaco.editor.setTheme('heroDark');

        const commonEditorOptions = {
            readOnly: true,
            domReadOnly: true,
            fontFamily: '"Consolas", "Courier New", monospace',
            fontSize: 12,
            lineNumbers: 'on',
            scrollBeyondLastLine: false,
            wordWrap: 'on',
            minimap: { enabled: false },
            renderLineHighlight: 'all', // Ensures highlight is distinct across the whole row
            renderLineHighlightOnlyWhenFocus: false, // Keep highlight visible when clicking toolbar
            automaticLayout: true 
        };

        updateLanguageDefinition(document.getElementById('parserTemplate').value);

        mainEditor = monaco.editor.create(document.getElementById('mainEditorContainer'), {
            ...commonEditorOptions,
            model: monaco.editor.createModel("Select a file to begin analysis.", currentLanguageId),
        });

        filterEditor = monaco.editor.create(document.getElementById('filterEditorContainer'), {
            ...commonEditorOptions,
            model: monaco.editor.createModel("Filtered results will appear here.", currentLanguageId),
        });

        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('searchInput').addEventListener('keydown', handleSearch);
        document.getElementById('parserTemplate').addEventListener('input', () => {
            updateLanguageDefinition(document.getElementById('parserTemplate').value);
        });
        
        setupEditorSync();
        setupSplitterDrag();
    });

    function setupSplitterDrag() {
        const splitter = document.getElementById('splitter');
        const mainView = document.getElementById('mainView');
        const splitContainer = document.getElementById('splitContainer');
        let isDragging = false;

        splitter.addEventListener('mousedown', () => {
            isDragging = true;
            splitter.classList.add('dragging');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerRect = splitContainer.getBoundingClientRect();
            let newMainHeight = e.clientY - containerRect.top;
            const minHeight = 100;
            if (newMainHeight < minHeight) newMainHeight = minHeight;
            if (newMainHeight > containerRect.height - minHeight) newMainHeight = containerRect.height - minHeight;
            const percentage = (newMainHeight / containerRect.height) * 100;
            mainView.style.flex = `0 0 ${percentage}%`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            splitter.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    }

    function updateLanguageDefinition(template) {
        const regexMatches = [...template.matchAll(/\$\{([a-zA-Z0-9_]+)\}/g)];
        if (regexMatches.length === 0) return;

        let regexStr = '^';
        let actions = [];
        let lastIndex = 0;
        
        regexMatches.forEach((match, idx) => {
            const varName = match[1];
            const literalBefore = template.substring(lastIndex, match.index);
            if (literalBefore.length > 0) {
                const escapedLiteral = literalBefore.replace(/\s+/g, ' ').replace(/[.*+?^$()[\]{}|\\]/g, '\\$&').replace(/ /g, '\\s+');
                regexStr += `(${escapedLiteral})`;
                actions.push('log-literal');
            }
            const isLast = idx === regexMatches.length - 1;
            regexStr += isLast ? '(.*)' : '(.*?)';
            
            if (varName === 'level') {
                actions.push({
                    cases: {
                        '~^\\s*(error|fatal|exception|severe)\\s*$': 'log-level-error',
                        '~^\\s*(warn|warning)\\s*$': 'log-level-warn',
                        '~^\\s*info\\s*$': 'log-level-info',
                        '~^\\s*debug\\s*$': 'log-level-debug',
                        '~^\\s*trace\\s*$': 'log-level-trace',
                        '@default': 'log-part-level',
                    }
                });
            } else {
                actions.push(`log-part-${varName}`);
            }
            lastIndex = match.index + match[0].length;
        });

        const literalAfter = template.substring(lastIndex);
        if (literalAfter.length > 0) {
            const escapedLiteral = literalAfter.replace(/\s+/g, ' ').replace(/[.*+?^$()[\]{}|\\]/g, '\\$&').replace(/ /g, '\\s+');
            regexStr += `(${escapedLiteral})?`;
            actions.push('log-literal');
        }

        languageCounter++;
        currentLanguageId = `hero-log-${languageCounter}`;
        monaco.languages.register({ id: currentLanguageId });
        monaco.languages.setMonarchTokensProvider(currentLanguageId, {
            ignoreCase: true,
            tokenizer: {
                root: [
                    [new RegExp(regexStr), actions],
                    [/.+/, 'log-part-message'] 
                ]
            }
        });

        if (mainEditor && mainEditor.getModel()) monaco.editor.setModelLanguage(mainEditor.getModel(), currentLanguageId);
        if (filterEditor && filterEditor.getModel()) monaco.editor.setModelLanguage(filterEditor.getModel(), currentLanguageId);
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            rawLogLines = ev.target.result.split(/\r?\n/);
            mainEditor.setModel(monaco.editor.createModel(ev.target.result, currentLanguageId));
            applyFilter();
        };
        reader.readAsText(file);
    }

    function handleSearch(e) {
        if (e.key === 'Enter') applyFilter();
    }

    function applyFilter() {
        const query = document.getElementById('searchInput').value.trim();
        document.getElementById('searchInput').classList.toggle('active-filter', !!query);

        filteredDataMap = [];
        if (!query) {
            filterEditor.setModel(monaco.editor.createModel("Enter a filter term and press Enter.", currentLanguageId));
            return;
        }

        let regex;
        const regexMatch = query.match(/^\/(.*)\/([i]?)$/);
        if (regexMatch) {
            try { regex = new RegExp(regexMatch[1], regexMatch[2] || ''); } catch (e) { regex = null; }
        } else {
            regex = new RegExp(query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'i');
        }

        if (!regex) return;

        const filteredLines = [];
        for (let i = 0; i < rawLogLines.length; i++) {
            const line = rawLogLines[i];
            if (regex.test(line)) {
                filteredLines.push(line);
                filteredDataMap.push({ text: line, originalLineNumber: i + 1 });
            }
        }
        filterEditor.setModel(monaco.editor.createModel(filteredLines.join('\n'), currentLanguageId));
    }

    function setupEditorSync() {
        mainEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const originalLine = e.position.lineNumber;
            const filterIdx = filteredDataMap.findIndex(item => item.originalLineNumber === originalLine);
            if (filterIdx !== -1) {
                isSyncing = true;
                const targetLine = filterIdx + 1;
                filterEditor.revealLineInCenter(targetLine, monaco.editor.ScrollType.Immediate);
                filterEditor.setPosition({ lineNumber: targetLine, column: 1 });
                isSyncing = false;
            }
        });

        filterEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const mapping = filteredDataMap[e.position.lineNumber - 1];
            if (mapping) {
                isSyncing = true;
                mainEditor.revealLineInCenter(mapping.originalLineNumber, monaco.editor.ScrollType.Immediate);
                mainEditor.setPosition({ lineNumber: mapping.originalLineNumber, column: 1 });
                isSyncing = false;
            }
        });
    }
</script>
</body>
</html>
