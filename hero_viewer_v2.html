<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hero.LogViewer</title>
<style>
    body {
        margin: 0; background: #1e1e1e; color: #ddd;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 13px; display: flex; flex-direction: column; height: 100vh;
        overflow: hidden; /* Prevent page scrolling, we virtualize */
    }

    /* Minimal Toolbar */
    .toolbar {
        height: 40px; background: #252526; display: flex; align-items: center;
        gap: 8px; padding: 0 10px; border-bottom: 1px solid #000; flex-shrink: 0;
    }
    button, input, select {
        background: #3c3c3c; color: #ddd; border: 1px solid #555;
        padding: 4px 8px; border-radius: 2px; font-family: inherit; font-size: 12px;
    }
    input:focus { outline: 1px solid #007acc; }

    /* Split View Container */
    .split-container {
        display: flex; flex-direction: column; flex: 1; min-height: 0;
    }
    .view-pane {
        flex: 1; position: relative; overflow: auto; background: #1e1e1e;
    }
    .splitter {
        height: 4px; background: #333; cursor: row-resize; flex-shrink: 0;
    }

    /* Virtual DOM Row Styles */
    .v-row {
        position: absolute; left: 0; right: 0; height: 24px;
        display: flex; align-items: center; padding: 0 4px;
        border-bottom: 1px solid #2a2a2a; box-sizing: border-box;
        white-space: pre; overflow: hidden;
    }
    .v-row:hover { background: #2a2d2e; }
    .v-row.selected { background: #04395e; }

    .line-num {
        width: 60px; color: #858585; text-align: right; 
        margin-right: 12px; flex-shrink: 0; user-select: none;
    }
    .log-field {
        margin-right: 12px; flex-shrink: 0;
    }
    .log-message {
        flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Dynamic Highlight Classes */
    .level-TRACE { color: #808080; }
    .level-DEBUG { color: #a9a9a9; }
    .level-INFO  { color: #4fc1ff; }
    .level-WARN  { color: #cca700; }
    .level-ERROR { color: #f48771; font-weight: bold;}
    .level-FATAL { color: #ff0000; font-weight: bold; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput">
    <input id="parserTemplate" value="${date} [${thread}] ${level} ${logger} - ${message}" style="width: 300px;" title="Parser Template">
    <input id="searchInput" placeholder="Search (e.g. level:ERROR)" style="width: 250px;">
    <button id="applyBtn">Apply / Parse</button>
</div>

<div class="split-container">
    <div id="mainView" class="view-pane"></div>
    <div class="splitter"></div>
    <div id="filterView" class="view-pane"></div>
</div>

<script>
/**
 * SUBSYSTEM 1: Dynamic Parser Compiler
 * Turns "${date} [${thread}] ${level}" into a JS Regex with Named Capture Groups
 */
class ParserCompiler {
    static compile(template) {
        // 1. Escape regex specials, but temporarily protect our ${field} syntax
        let regexStr = template.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
        
        // 2. Replace escaped \$\{field\} with named capture groups (?<field>.*?)
        // Example: \$\{level\} becomes (?<level>.*?)
        regexStr = regexStr.replace(/\\$\\{([a-zA-Z0-9_]+)\\}/g, '(?<$1>.*?)');
        
        // 3. Make the message field grab the rest of the line greedily
        regexStr = regexStr.replace(/\(\?\<message\>\.\*\?\)/, '(?<message>.*)');
        
        return new RegExp("^" + regexStr + "$");
    }
}

/**
 * SUBSYSTEM 2: Data Model
 */
class LogModel {
    constructor() {
        this.rawLines = [];
        this.parsedEntries = [];
        this.filteredIndices = []; // Stores indices pointing to parsedEntries
        this.fields = []; // Discovered fields
    }

    parse(lines, templateStr) {
        this.rawLines = lines;
        this.parsedEntries = [];
        this.fields = [];

        const regex = ParserCompiler.compile(templateStr);
        
        // Extract field names from template for the registry
        const fieldMatches = [...templateStr.matchAll(/\$\{([a-zA-Z0-9_]+)\}/g)];
        this.fields = fieldMatches.map(m => m[1]);

        let currentEntry = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            const match = line.match(regex);

            if (match && match.groups) {
                currentEntry = {
                    index: i,
                    fields: match.groups,
                    raw: line
                };
                this.parsedEntries.push(currentEntry);
            } else if (currentEntry) {
                // Multiline fallback: append to message if it exists
                if (currentEntry.fields.message !== undefined) {
                    currentEntry.fields.message += "\n" + line;
                }
            } else {
                // Unparsed raw line
                this.parsedEntries.push({ index: i, fields: {}, raw: line });
            }
        }
        
        this.applyFilter(""); // Reset filter
    }

    applyFilter(query) {
        if (!query) {
            this.filteredIndices = this.parsedEntries.map(e => e.index);
            return;
        }

        const q = query.toLowerCase();
        this.filteredIndices = [];
        
        for (let i = 0; i < this.parsedEntries.length; i++) {
            const entry = this.parsedEntries[i];
            
            // Simple raw text search for V1. AI can easily upgrade this 
            // to support field queries like "level:ERROR" later.
            if (entry.raw.toLowerCase().includes(q)) {
                this.filteredIndices.push(i);
            }
        }
    }
}

/**
 * SUBSYSTEM 3: DOM Virtual Renderer
 * Renders ONLY the rows currently visible on screen.
 */
class VirtualList {
    constructor(container, getRowCount, getRowData) {
        this.container = container;
        this.getRowCount = getRowCount;
        this.getRowData = getRowData;
        
        this.rowHeight = 24; // Fixed height for speed
        this.visibleNodes = new Map();
        
        // The spacer forces the container to have a native scrollbar 
        // matching the total size of millions of rows.
        this.spacer = document.createElement('div');
        this.container.appendChild(this.spacer);

        this.container.addEventListener('scroll', () => this.render());
        window.addEventListener('resize', () => this.render());
    }

    update() {
        const totalRows = this.getRowCount();
        this.spacer.style.height = `${totalRows * this.rowHeight}px`;
        this.render();
    }

    render() {
        const scrollTop = this.container.scrollTop;
        const viewportHeight = this.container.clientHeight;
        const totalRows = this.getRowCount();

        // Calculate which rows should be visible
        const startIndex = Math.max(0, Math.floor(scrollTop / this.rowHeight) - 2);
        const endIndex = Math.min(totalRows, Math.ceil((scrollTop + viewportHeight) / this.rowHeight) + 2);

        // Remove DOM nodes that are no longer visible
        for (let [index, node] of this.visibleNodes.entries()) {
            if (index < startIndex || index >= endIndex) {
                this.container.removeChild(node);
                this.visibleNodes.delete(index);
            }
        }

        // Add missing DOM nodes
        for (let i = startIndex; i < endIndex; i++) {
            if (!this.visibleNodes.has(i)) {
                const row = this.createRow(i);
                this.container.appendChild(row);
                this.visibleNodes.set(i, row);
            }
        }
    }

    createRow(rowIndex) {
        const entry = this.getRowData(rowIndex);
        const div = document.createElement('div');
        div.className = 'v-row';
        div.style.top = `${rowIndex * this.rowHeight}px`;

        // Build the HTML based on parsed fields
        let html = `<div class="line-num">${entry.index + 1}</div>`;
        
        // If parsed successfully
        if (Object.keys(entry.fields).length > 0) {
            for (let [key, val] of Object.entries(entry.fields)) {
                if (key === 'message') {
                    html += `<div class="log-message">${this.escape(val)}</div>`;
                } else {
                    // Inject CSS class for levels automatically
                    const colorClass = key === 'level' ? `level-${val}` : '';
                    html += `<div class="log-field ${colorClass}">${this.escape(val)}</div>`;
                }
            }
        } else {
            // Unparsed
            html += `<div class="log-message">${this.escape(entry.raw)}</div>`;
        }

        div.innerHTML = html;
        return div;
    }

    escape(str) {
        return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
}

/**
 * APP INITIALIZATION & BINDING
 */
const model = new LogModel();
let mainVirtualList = null;
let filterVirtualList = null;

// Initialize Virtual Lists
mainVirtualList = new VirtualList(
    document.getElementById('mainView'), 
    () => model.parsedEntries.length,
    (i) => model.parsedEntries[i]
);

filterVirtualList = new VirtualList(
    document.getElementById('filterView'), 
    () => model.filteredIndices.length,
    (i) => model.parsedEntries[model.filteredIndices[i]]
);

// UI Event Listeners
document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // For V1, read whole file (AI can adapt this to chunked reading later)
    const reader = new FileReader();
    reader.onload = (ev) => {
        const lines = ev.target.result.split(/\r?\n/);
        const template = document.getElementById('parserTemplate').value;
        
        console.time("Parse Time");
        model.parse(lines, template);
        console.timeEnd("Parse Time");

        mainVirtualList.update();
        filterVirtualList.update();
    };
    reader.readAsText(file);
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    model.applyFilter(e.target.value);
    filterVirtualList.update();
});

document.getElementById('applyBtn').addEventListener('click', () => {
    // Re-parse with new template
    if (model.rawLines.length > 0) {
        const template = document.getElementById('parserTemplate').value;
        model.parse(model.rawLines, template);
        mainVirtualList.update();
        filterVirtualList.update();
    }
});

</script>
</body>
</html>
