<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hero.LogViewer</title>
<style>
    :root {
        --bg-deep-blue: #0d1b2a;
        --bg-mid-blue: #1b263b;
        --bg-light-blue: #2a3a50;
        --text-cream: #e0e1dd;
        --accent-cyan: #61dafb;
        --accent-yellow: #f7b801;
        --accent-red: #f45b69;
        --accent-gray: #778da9;
        --accent-lavender: #b39ddb;
        --accent-teal: #80cbc4;
    }

    body {
        margin: 0; background: var(--bg-deep-blue); color: var(--text-cream);
        font-family: "Consolas", "Courier New", monospace;
        font-size: 12px; display: flex; flex-direction: column; height: 100vh;
        overflow: hidden;
    }

    /* Dark Scrollbar for the page */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg-mid-blue); }
    ::-webkit-scrollbar-thumb {
        background-color: var(--bg-light-blue);
        border-radius: 6px;
        border: 2px solid var(--bg-mid-blue);
    }
    ::-webkit-scrollbar-thumb:hover { background-color: #4a5a70; }
    ::-webkit-scrollbar-corner { background: transparent; }

    .toolbar {
        height: 32px; background: var(--bg-mid-blue); display: flex; align-items: center;
        gap: 8px; padding: 0 8px; border-bottom: 1px solid #000; flex-shrink: 0;
    }
    button, input, select {
        background: var(--bg-light-blue); color: var(--text-cream); border: 1px solid #000;
        padding: 4px 8px; border-radius: 2px; font-family: inherit; font-size: 12px;
    }
    input:focus { outline: 1px solid var(--accent-cyan); }
    #parserTemplate { width: 350px; }
    #searchInput { flex-grow: 1; }
    #searchInput.active-filter { color: var(--accent-cyan); }

    .split-container {
        display: flex; flex-direction: column; flex: 1; min-height: 0;
    }
    .view-pane {
        flex: 1; position: relative; overflow: hidden; /* Monaco handles its own scrolling */
    }
    .splitter {
        height: 4px; background: var(--bg-mid-blue); cursor: row-resize; flex-shrink: 0;
    }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput">
    <input id="parserTemplate" value="${timestamp} [${level}] [${thread}] ${logger} ${message}" title="Log Parser Template">
    <input id="searchInput" placeholder="Filter with text or /regex/ and press Enter">
</div>

<div class="split-container">
    <div id="mainView" class="view-pane"></div>
    <div class="splitter"></div>
    <div id="filterView" class="view-pane"></div>
</div>

<script>
    let mainEditor;
    let filterEditor;
    let rawLogLines = [];
    let filteredDataMap = []; 
    let isSyncing = false; 
    
    // Counter to generate unique language IDs every time the template changes
    let languageCounter = 0;
    let currentLanguageId = 'hero-log-0';

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        
        // Define highly visible theme colors
        monaco.editor.defineTheme('islandDark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
                { token: 'log-part-timestamp', foreground: '888888' },       // Gray
                { token: 'log-part-thread', foreground: 'ffaaaa' },          // Light Pink
                { token: 'log-part-logger', foreground: 'aaaaff' },          // Light Blue
                { token: 'log-level-error', foreground: 'ff5555', fontStyle: 'bold' }, // Vibrant Red
                { token: 'log-level-warn', foreground: 'ffaa00' },           // Vibrant Orange
                { token: 'log-level-info', foreground: '55ffff' },           // Cyan
                { token: 'log-level-debug', foreground: '55ff55' },          // Vibrant Green
                { token: 'log-level-trace', foreground: 'ff55ff' },          // Magenta
                { token: 'log-part-level', foreground: 'ffffff' },           // Fallback Level
                { token: 'log-part-message', foreground: 'e0e1dd' },         // Standard Message
                { token: 'log-literal', foreground: '555555' }               // Dark Gray for brackets/spaces
            ],
            colors: {
                'editor.background': '#0d1b2a',
                'editor.foreground': '#e0e1dd',
                'editorCursor.foreground': '#61dafb',
                'editor.lineHighlightBackground': '#1b263b',
                'editor.selectionBackground': '#2a3a50',
                'editorWidget.background': '#1b263b',
                'editorWidget.border': '#000',
                'scrollbar.shadow': '#00000000',
                'scrollbarSlider.background': '#2a3a50',
                'scrollbarSlider.hoverBackground': '#4a5a70',
                'scrollbarSlider.activeBackground': '#4a5a70',
            }
        });
        monaco.editor.setTheme('islandDark');

        const commonEditorOptions = {
            readOnly: true,
            domReadOnly: true,
            fontFamily: '"Consolas", "Courier New", monospace',
            fontSize: 12,
            lineNumbers: 'on',
            scrollBeyondLastLine: false,
            wordWrap: 'on',
            minimap: { enabled: false },
            renderLineHighlight: 'gutter',
            occurrencesHighlight: false,
        };

        // Initialize the first language state
        updateLanguageDefinition(document.getElementById('parserTemplate').value);

        mainEditor = monaco.editor.create(document.getElementById('mainView'), {
            ...commonEditorOptions,
            model: monaco.editor.createModel("Drop a log file here to begin.", currentLanguageId),
        });

        filterEditor = monaco.editor.create(document.getElementById('filterView'), {
            ...commonEditorOptions,
            model: monaco.editor.createModel("Filtered results will appear here.", currentLanguageId),
        });

        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('searchInput').addEventListener('keydown', handleSearch);
        document.getElementById('parserTemplate').addEventListener('input', () => {
            updateLanguageDefinition(document.getElementById('parserTemplate').value);
        });
        
        setupEditorSync();
    });

    function updateLanguageDefinition(template) {
        const regexMatches = [...template.matchAll(/\$\{([a-zA-Z0-9_]+)\}/g)];
        if (regexMatches.length === 0) return;

        let regexStr = '^';
        let actions = [];
        let lastIndex = 0;
        
        // Build capture groups for BOTH variables AND the literal text in between them
        regexMatches.forEach((match, idx) => {
            const varName = match[1];
            const literalBefore = template.substring(lastIndex, match.index);
            
            if (literalBefore.length > 0) {
                // Escape regex characters and allow flexible spacing (requires at least one space if space exists)
                const escapedLiteral = literalBefore
                    .replace(/\s+/g, ' ')
                    .replace(/[.*+?^$()[\]{}|\\]/g, '\\$&')
                    .replace(/ /g, '\\s+');
                regexStr += `(${escapedLiteral})`;
                actions.push('log-literal'); // Dim color for brackets/delimiters
            }

            // The last variable captures the rest of the line, others capture non-greedily
            const isLast = idx === regexMatches.length - 1;
            regexStr += isLast ? '(.*)' : '(.*?)';
            
            if (varName === 'level') {
                actions.push({
                    // Use regex matchers (prefix ~) in cases to completely ignore accidental spacing inside brackets
                    cases: {
                        '~^\\s*(error|fatal|exception)\\s*$': 'log-level-error',
                        '~^\\s*(warn|warning)\\s*$': 'log-level-warn',
                        '~^\\s*info\\s*$': 'log-level-info',
                        '~^\\s*debug\\s*$': 'log-level-debug',
                        '~^\\s*trace\\s*$': 'log-level-trace',
                        '@default': 'log-part-level', // Fallback if level is unrecognized
                    }
                });
            } else {
                actions.push(`log-part-${varName}`);
            }

            lastIndex = match.index + match[0].length;
        });

        // Capture any remaining literal text at the end of the template (Make it optional in case the user is still typing it out)
        const literalAfter = template.substring(lastIndex);
        if (literalAfter.length > 0) {
            const escapedLiteral = literalAfter
                .replace(/\s+/g, ' ')
                .replace(/[.*+?^$()[\]{}|\\]/g, '\\$&')
                .replace(/ /g, '\\s+');
            regexStr += `(${escapedLiteral})?`;
            actions.push('log-literal');
        }

        // Create a unique Language ID to force Monaco to re-parse dynamic changes
        languageCounter++;
        currentLanguageId = `hero-log-${languageCounter}`;
        monaco.languages.register({ id: currentLanguageId });

        monaco.languages.setMonarchTokensProvider(currentLanguageId, {
            ignoreCase: true,
            tokenizer: {
                root: [
                    // Primary rule applies the dynamic capture groups
                    [new RegExp(regexStr), actions],
                    
                    // Fallback rule: if a line doesn't match the template, style it as standard message text instead of breaking
                    [/.+/, 'log-part-message'] 
                ]
            }
        });

        // Apply new language rules to existing editors immediately
        if (mainEditor && mainEditor.getModel()) {
            monaco.editor.setModelLanguage(mainEditor.getModel(), currentLanguageId);
        }
        if (filterEditor && filterEditor.getModel()) {
            monaco.editor.setModelLanguage(filterEditor.getModel(), currentLanguageId);
        }
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            rawLogLines = ev.target.result.split(/\r?\n/);
            mainEditor.setModel(monaco.editor.createModel(ev.target.result, currentLanguageId));
            updateLanguageDefinition(document.getElementById('parserTemplate').value);
            applyFilter();
        };
        reader.readAsText(file);
    }

    function handleSearch(e) {
        if (e.key === 'Enter') {
            applyFilter();
        }
    }

    function applyFilter() {
        const query = document.getElementById('searchInput').value;
        document.getElementById('searchInput').classList.toggle('active-filter', !!query);

        filteredDataMap = [];
        if (!query) {
            filterEditor.setModel(monaco.editor.createModel("", currentLanguageId));
            return;
        }

        let regex;
        const regexMatch = query.match(/^\/(.*)\/([i]?)$/);
        if (regexMatch) {
            try { regex = new RegExp(regexMatch[1], regexMatch[2] || ''); } catch (e) { regex = null; }
        } else {
            const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            regex = new RegExp(escapedQuery, 'i');
        }

        if (!regex) {
             filterEditor.setModel(monaco.editor.createModel("Invalid Regex", currentLanguageId));
             return;
        }

        const filteredLines = [];
        for (let i = 0; i < rawLogLines.length; i++) {
            const line = rawLogLines[i];
            if (regex.test(line)) {
                filteredLines.push(line);
                filteredDataMap.push({ text: line, originalLineNumber: i + 1 });
            }
        }
        
        filterEditor.setModel(monaco.editor.createModel(filteredLines.join('\n'), currentLanguageId));
    }

    function setupEditorSync() {
        mainEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            
            const originalLine = e.position.lineNumber;
            const filterLine = filteredDataMap.findIndex(item => item.originalLineNumber === originalLine);

            if (filterLine !== -1) {
                isSyncing = true;
                const targetLine = filterLine + 1;
                filterEditor.revealLineInCenter(targetLine, monaco.editor.ScrollType.Immediate);
                filterEditor.setSelection(new monaco.Range(targetLine, 1, targetLine, 1));
                isSyncing = false;
            }
        });

        filterEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            
            const mapping = filteredDataMap[e.position.lineNumber - 1];
            if (mapping) {
                isSyncing = true;
                mainEditor.revealLineInCenter(mapping.originalLineNumber, monaco.editor.ScrollType.Immediate);
                mainEditor.setSelection(new monaco.Range(mapping.originalLineNumber, 1, mapping.originalLineNumber, 1));
                isSyncing = false;
            }
        });
    }
</script>
</body>
</html>
