<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hero.LogViewer</title>
<style>
    body {
        margin: 0; background: #1e1e1e; color: #ddd;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 12px; display: flex; flex-direction: column; height: 100vh;
        overflow: hidden;
    }

    /* Dark Scrollbar */
    ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
    }
    ::-webkit-scrollbar-track {
        background: #252526;
    }
    ::-webkit-scrollbar-thumb {
        background-color: #4f4f4f;
        border-radius: 6px;
        border: 2px solid #252526;
    }
    ::-webkit-scrollbar-thumb:hover {
        background-color: #6a6a6a;
    }
    ::-webkit-scrollbar-corner {
        background: transparent;
    }

    .toolbar {
        height: 32px; background: #252526; display: flex; align-items: center;
        gap: 8px; padding: 0 8px; border-bottom: 1px solid #000; flex-shrink: 0;
    }
    button, input, select {
        background: #3c3c3c; color: #ddd; border: 1px solid #555;
        padding: 4px 8px; border-radius: 2px; font-family: inherit; font-size: 12px;
    }
    input:focus { outline: 1px solid #007acc; }
    #searchInput { flex-grow: 1; } /* Allow search to fill space */

    .split-container {
        display: flex; flex-direction: column; flex: 1; min-height: 0;
    }
    .view-pane {
        flex: 1; position: relative; overflow: auto; background: #1e1e1e;
    }
    .splitter {
        height: 4px; background: #333; cursor: row-resize; flex-shrink: 0;
    }

    .v-row {
        position: absolute; left: 0; right: 0;
        display: flex; align-items: flex-start; padding: 4px;
        border-bottom: 1px solid #2a2a2a; box-sizing: border-box;
        cursor: pointer;
    }
    .v-row:hover { background: #2a2d2e; }
    .v-row.selected { background: #04395e; }

    .line-num {
        width: 50px; color: #858585; text-align: right;
        margin-right: 10px; flex-shrink: 0; user-select: none; padding-top: 2px;
    }
    
    .log-content {
        display: flex; flex-direction: column; flex: 1; overflow: hidden;
    }
    .log-header {
        display: flex; gap: 12px; white-space: pre;
    }
    .log-field { flex-shrink: 0; }
    .log-logger, .log-message {
        white-space: pre-wrap;
        word-break: break-all;
        margin-top: 2px;
    }
    .log-logger { color: #858585; }

    .level-TRACE { color: #808080; }
    .level-DEBUG { color: #a9a9a9; }
    .level-INFO  { color: #4fc1ff; }
    .level-WARN  { color: #cca700; }
    .level-ERROR { color: #f48771; font-weight: bold; }
    .level-FATAL { color: #ff0000; font-weight: bold; }
</style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="fileInput">
    <input id="parserTemplate" value="${date} [${thread}] ${level} ${logger} - ${message}" style="width: 300px;" title="Parser Template">
    <input id="searchInput" placeholder="Search (text, regex, or field:value)">
    <button id="applyBtn">Apply / Parse</button>
</div>

<div class="split-container">
    <div id="mainView" class="view-pane"></div>
    <div class="splitter"></div>
    <div id="filterView" class="view-pane"></div>
</div>

<script>
class ParserCompiler {
    static compile(template) {
        let regexStr = template.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
        regexStr = regexStr.replace(/\\$\\{([a-zA-Z0-9_]+)\\}/g, '(?<$1>.*?)');
        regexStr = regexStr.replace(/\(\?\<message\>\.\*\?\)/, '(?<message>.*)');
        return new RegExp("^" + regexStr + "$");
    }
}

class LogModel {
    constructor() {
        this.rawLines = [];
        this.parsedEntries = [];
        this.filteredIndices = [];
        this.fields = [];
    }

    parse(lines, templateStr) {
        this.rawLines = lines;
        this.parsedEntries = [];
        this.fields = [];

        const regex = ParserCompiler.compile(templateStr);
        const fieldMatches = [...templateStr.matchAll(/\$\{([a-zA-Z0-9_]+)\}/g)];
        this.fields = fieldMatches.map(m => m[1]);

        let currentEntry = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!line.trim()) continue;

            const match = line.match(regex);

            if (match && match.groups) {
                currentEntry = { index: this.parsedEntries.length, fields: match.groups, raw: line };
                this.parsedEntries.push(currentEntry);
            } else if (currentEntry) {
                currentEntry.fields.message += "\n" + line;
                currentEntry.raw += "\n" + line;
            } else {
                this.parsedEntries.push({ index: this.parsedEntries.length, fields: {}, raw: line });
            }
        }
        this.applyFilter("");
    }

    applyFilter(query) {
        this.filteredIndices = [];
        if (!query) {
            this.filteredIndices = this.parsedEntries.map((_, i) => i);
            return;
        }

        const q = query.toLowerCase();
        const fieldQueryMatch = q.match(/^(\w+):(.*)/);
        let regex;
        try { regex = new RegExp(query, "i"); } catch (e) { regex = null; }

        for (let i = 0; i < this.parsedEntries.length; i++) {
            const entry = this.parsedEntries[i];
            let match = false;

            if (fieldQueryMatch) {
                const key = fieldQueryMatch[1];
                const value = fieldQueryMatch[2];
                if (entry.fields[key] && entry.fields[key].toLowerCase().includes(value)) {
                    match = true;
                }
            } else if (regex && regex.test(entry.raw)) {
                match = true;
            } else if (entry.raw.toLowerCase().includes(q)) {
                match = true;
            }

            if (match) {
                this.filteredIndices.push(i);
            }
        }
    }
}

class VirtualList {
    constructor(id, container, getRowCount, getRowData) {
        this.id = id;
        this.container = container;
        this.getRowCount = getRowCount;
        this.getRowData = getRowData;
        
        this.rowCache = [];
        this.visibleNodes = new Map();
        this.averageHeight = 20; // Initial guess
        
        this.spacer = document.createElement('div');
        this.container.appendChild(this.spacer);

        this.measureNode = document.createElement('div');
        this.measureNode.className = 'v-row';
        this.measureNode.style.position = 'absolute';
        this.measureNode.style.visibility = 'hidden';
        this.measureNode.style.width = '100%';
        this.container.appendChild(this.measureNode);

        this.container.addEventListener('scroll', () => this.render());
        window.addEventListener('resize', () => { this.reset(); this.render(); });
    }

    reset() {
        this.rowCache = [];
        this.visibleNodes.forEach(node => this.container.removeChild(node));
        this.visibleNodes.clear();
    }

    update() {
        this.reset();
        this.render();
    }

    render() {
        const scrollTop = this.container.scrollTop;
        const viewportHeight = this.container.clientHeight;
        const totalRows = this.getRowCount();

        let totalHeight = 0;
        if (this.rowCache.length > 0) {
            const lastCached = this.rowCache[this.rowCache.length - 1];
            totalHeight = lastCached.y + lastCached.height;
            if (this.rowCache.length < totalRows) {
                this.averageHeight = totalHeight / this.rowCache.length;
                totalHeight += (totalRows - this.rowCache.length) * this.averageHeight;
            }
        } else {
            totalHeight = totalRows * this.averageHeight;
        }
        this.spacer.style.height = `${totalHeight}px`;

        let startIndex = 0;
        for (let i = 0; i < this.rowCache.length; i++) {
            if (this.rowCache[i].y + this.rowCache[i].height > scrollTop) {
                startIndex = i;
                break;
            }
        }
        startIndex = Math.max(0, startIndex - 5);

        let currentY = this.rowCache[startIndex]?.y || 0;
        if (startIndex > 0 && !this.rowCache[startIndex]) {
             currentY = (this.rowCache[startIndex-1].y + this.rowCache[startIndex-1].height);
        }

        let i = startIndex;
        while (i < totalRows && currentY < scrollTop + viewportHeight) {
            let cached = this.rowCache[i];
            if (!cached) {
                const height = this.measureRow(i);
                cached = { y: currentY, height: height };
                this.rowCache[i] = cached;
            }

            if (!this.visibleNodes.has(i)) {
                const node = this.createRow(i, cached);
                this.container.appendChild(node);
                this.visibleNodes.set(i, node);
            }
            currentY += cached.height;
            i++;
        }
        const endIndex = i;

        for (let [index, node] of this.visibleNodes.entries()) {
            if (index < startIndex || index >= endIndex) {
                this.container.removeChild(node);
                this.visibleNodes.delete(index);
            }
        }
    }

    measureRow(rowIndex) {
        this.measureNode.innerHTML = this.getRowHtml(this.getRowData(rowIndex));
        return this.measureNode.offsetHeight;
    }

    getRowHtml(entry) {
        let html = `<div class="line-num">${entry.index + 1}</div>`;
        if (Object.keys(entry.fields).length > 0) {
            const level = this.escape(entry.fields.level || '').toUpperCase();
            html += `
                <div class="log-content">
                    <div class="log-header">
                        <span class="log-field level-${level}">${level}</span>
                        <span class="log-field">${this.escape(entry.fields.date || '')}</span>
                        <span class="log-field">[${this.escape(entry.fields.thread || '')}]</span>
                    </div>
                    <div class="log-logger">${this.escape(entry.fields.logger || '')}</div>
                    <div class="log-message">${this.escape(entry.fields.message || '')}</div>
                </div>`;
        } else {
            html += `<div class="log-message">${this.escape(entry.raw)}</div>`;
        }
        return html;
    }

    createRow(rowIndex, cached) {
        const entry = this.getRowData(rowIndex);
        const div = document.createElement('div');
        div.className = 'v-row';
        div.style.top = `${cached.y}px`;
        div.style.height = `${cached.height}px`;
        div.innerHTML = this.getRowHtml(entry);

        div.addEventListener('click', () => selectionManager.select(entry.index, this.id));
        
        if (entry.index === selectionManager.selectedIndex) {
            div.classList.add('selected');
        }
        
        return div;
    }

    scrollToIndex(index) {
        if (this.rowCache[index]) {
            this.container.scrollTop = this.rowCache[index].y - (this.container.clientHeight / 2);
        } else {
            // Estimate position if not measured yet
            this.container.scrollTop = index * this.averageHeight - (this.container.clientHeight / 2);
        }
    }

    escape(str) {
        return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
}

const model = new LogModel();
let mainVirtualList = null;
let filterVirtualList = null;

const selectionManager = {
    selectedIndex: -1,
    select(originalIndex, sourceViewId) {
        if (this.selectedIndex === originalIndex) return;
        this.selectedIndex = originalIndex;

        // Re-render visible rows to update selection highlight
        mainVirtualList.visibleNodes.forEach((node, i) => node.classList.toggle('selected', model.parsedEntries[i].index === originalIndex));
        filterVirtualList.visibleNodes.forEach((node, i) => node.classList.toggle('selected', model.parsedEntries[model.filteredIndices[i]].index === originalIndex));

        if (sourceViewId === 'filterView') {
            mainVirtualList.scrollToIndex(originalIndex);
        } else {
            const filterIndex = model.filteredIndices.indexOf(originalIndex);
            if (filterIndex > -1) {
                filterVirtualList.scrollToIndex(filterIndex);
            }
        }
    }
};

mainVirtualList = new VirtualList('mainView', document.getElementById('mainView'), () => model.parsedEntries.length, (i) => model.parsedEntries[i]);
filterVirtualList = new VirtualList('filterView', document.getElementById('filterView'), () => model.filteredIndices.length, (i) => model.parsedEntries[model.filteredIndices[i]]);

document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
        const lines = ev.target.result.split(/\r?\n/);
        const template = document.getElementById('parserTemplate').value;
        
        model.parse(lines, template);
        mainVirtualList.update();
        filterVirtualList.update();
    };
    reader.readAsText(file);
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    model.applyFilter(e.target.value);
    filterVirtualList.update();
});

document.getElementById('applyBtn').addEventListener('click', () => {
    if (model.rawLines.length > 0) {
        const template = document.getElementById('parserTemplate').value;
        model.parse(model.rawLines, template);
        mainVirtualList.update();
        filterVirtualList.update();
    }
});
</script>
</body>
</html>
