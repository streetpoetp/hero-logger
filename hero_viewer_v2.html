<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hero.LogViewer</title>
    <style>
        :root {
            --bg-charcoal: #1e1e1e;
            --bg-charcoal-secondary: #2c2c2e;
            --bg-control: #3c3c3e;
            --text-off-white: #dcdcdc;
            --accent-sky-blue: #569cd6;
            --accent-soft-coral: #f47067;
            --accent-gray: #808080;
        }

        body {
            margin: 0; background: var(--bg-charcoal); color: var(--text-off-white);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px; display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* Dark Scrollbar */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-charcoal-secondary); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--bg-control);
            border-radius: 6px;
            border: 2px solid var(--bg-charcoal-secondary);
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #4a4a4a; }

        .split-container {
            display: flex; flex-direction: column; flex: 1; min-height: 0;
        }

        .view-pane {
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        #mainView { flex: 1 1 50%; }
        #filterView { flex: 1 1 50%; background: var(--bg-charcoal-secondary); }

        /* Toolbar */
        .toolbar {
            height: 36px; background: var(--bg-charcoal-secondary); display: flex; align-items: center;
            gap: 12px; padding: 0 12px; border-bottom: 1px solid #000; flex-shrink: 0;
            z-index: 20;
        }
        
        #mainView .toolbar {
            background: var(--bg-charcoal);
        }

        .editor-container { flex: 1; width: 100%; min-height: 0; }

        button, input {
            background: var(--bg-control); color: var(--text-off-white); border: 1px solid #000;
            padding: 5px 10px; border-radius: 2px; font-family: inherit; font-size: 14px;
        }

        #fileInput { width: 220px; }

        #logPartsContainer, #filterLogPartsContainer {
            display: flex; align-items: center; gap: 10px;
        }
        #logPartsContainer label, #filterLogPartsContainer label {
            --checkbox-color: var(--text-off-white); /* Fallback color */
            display: flex; align-items: center; gap: 4px; cursor: pointer;
            text-transform: capitalize;
            position: relative;
            user-select: none;
        }
        
        #logPartsContainer {
            margin-left: auto;
        }

        /* Custom Checkbox Styling */
        #logPartsContainer label input, #filterLogPartsContainer label input {
            position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
        }
        .custom-checkbox {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--checkbox-color);
            border-radius: 3px;
            transition: background-color 0.15s;
            position: relative;
        }
        .custom-checkbox::after {
            content: "✔";
            position: absolute;
            top: -3px;
            left: 1px;
            font-size: 14px;
            color: var(--bg-charcoal);
            opacity: 0;
            transition: opacity 0.15s;
        }
        input:checked ~ .custom-checkbox {
            background-color: var(--checkbox-color);
        }
        input:checked ~ .custom-checkbox::after {
            opacity: 1;
        }


        /* Stretches the search input to take the rest of the space */
        #searchInput { flex: 1; min-width: 100px; }
        #searchInput:focus { outline: 1px solid var(--accent-sky-blue); border-color: var(--accent-sky-blue); }
        #searchInput.active-filter { color: var(--accent-sky-blue); font-weight: bold; border-color: var(--accent-sky-blue); }

        .splitter {
            height: 8px; background: #000; cursor: row-resize; flex-shrink: 0;
            transition: background 0.2s; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .splitter::after {
            content: "•••"; color: var(--accent-gray); letter-spacing: 2px; font-size: 10px;
        }
        .splitter:hover, .splitter.dragging { background: var(--accent-sky-blue); }
    </style>
</head>
<body>

<div class="split-container" id="splitContainer">
    <!-- Top Pane: Full Log -->
    <div id="mainView" class="view-pane">
        <div class="toolbar">
            <input type="file" id="fileInput">
            <div id="logPartsContainer"></div>
        </div>
        <div id="mainEditorContainer" class="editor-container"></div>
    </div>

    <!-- Drag Handle -->
    <div class="splitter" id="splitter"></div>

    <!-- Bottom Pane: Filter & Controls -->
    <div id="filterView" class="view-pane">
        <div class="toolbar">
            <input id="searchInput" placeholder="Search / Filter (Regex supported: /ERROR|WARN/i) - Press Enter to apply">
            <div id="filterLogPartsContainer"></div>
        </div>
        <div id="filterEditorContainer" class="editor-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs/loader.js"></script>

<script>
    /** 
     * USER CUSTOMIZATION: EDIT THIS TEMPLATE
     * This template is the single source of truth for the log format.
     * It's a space-separated list of "groups". Each group must contain one variable.
     */
    const LOG_FORMAT_TEMPLATE = "${timestamp} [${level}] [${thread}] ${logger} ${message}";

    const THEME_RULES = [
        { token: 'log-part-timestamp', foreground: '808080' },
        { token: 'log-part-thread', foreground: '80b0c0' },
        { token: 'log-part-logger', foreground: '40a080' },
        { token: 'log-level-error', foreground: 'd06050', fontStyle: 'bold' },
        { token: 'log-level-warn', foreground: 'b08060', fontStyle: 'bold' },
        { token: 'log-level-info', foreground: '4080b0' },
        { token: 'log-level-debug', foreground: '90b080' },
        { token: 'log-level-trace', foreground: 'a070a0' },
        { token: 'log-part-level', foreground: 'c0c0c0' },
        { token: 'log-part-message', foreground: 'c0c0c0' },
        { token: 'log-literal', foreground: '555555' },
    ];
    const TOKEN_COLOR_MAP = new Map(THEME_RULES.map(rule => [rule.token, rule.foreground]));

    let mainEditor, filterEditor;
    let rawLogLines = [], filteredDataMap = [];
    let isSyncing = false, languageCounter = 0;
    
    // These will be derived from the template
    let templateTokens;
    let lineParserRegex;

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        
        monaco.editor.defineTheme('riderIslandsDark', {
            base: 'vs-dark',
            inherit: true,
            rules: THEME_RULES,
            colors: {
                'editor.background': '#1e1e1e',
                'editor.foreground': '#dcdcdc',
                'editorCursor.foreground': '#aeafad',
                'editor.lineHighlightBackground': '#2d3032',
                'editor.lineHighlightBorder': '#3a3d41',
                'editor.selectionBackground': '#3a3d41',
                'editor.selectionHighlightBackground': '#264f78',
                'editorWidget.background': '#252526',
                'editorWidget.border': '#569cd6',
                'scrollbarSlider.background': '#3c3c3e',
                'scrollbarSlider.hoverBackground': '#4a4a4a',
            }
        });
        monaco.editor.setTheme('riderIslandsDark');

        const commonEditorOptions = {
            readOnly: true, domReadOnly: true,
            fontFamily: '"Consolas", "Courier New", monospace', fontSize: 14,
            lineNumbers: 'on', scrollBeyondLastLine: false, wordWrap: 'on',
            minimap: { enabled: false }, renderLineHighlight: 'all',
            renderLineHighlightOnlyWhenFocus: false, automaticLayout: true 
        };

        initializeFormattingControls();

        mainEditor = monaco.editor.create(document.getElementById('mainEditorContainer'), { ...commonEditorOptions, model: monaco.editor.createModel("Hero.LogViewer: Please select a file to begin.") });
        filterEditor = monaco.editor.create(document.getElementById('filterEditorContainer'), { ...commonEditorOptions, model: monaco.editor.createModel("Filtered results will appear here.") });

        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('searchInput').addEventListener('keydown', handleSearch);
        
        setupEditorSync();
        setupSplitterDrag();
    });

    function initializeFormattingControls() {
        parseLogTemplate(LOG_FORMAT_TEMPLATE);
        setupLogPartsControl('logPartsContainer');
        setupLogPartsControl('filterLogPartsContainer');
        updateLineParser();
    }

    function setupLogPartsControl(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        container.innerHTML = '';
        templateTokens.forEach(token => {
            const label = document.createElement('label');
            label.title = token.partName;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.dataset.part = token.partName;
            checkbox.checked = true;

            const customCheckbox = document.createElement('span');
            customCheckbox.className = 'custom-checkbox';
            
            const shortName = getShortName(token.partName);
            
            // Sync label and checkbox color with theme
            let tokenName = `log-part-${token.partName}`;
            if (token.partName === 'level') {
                tokenName = 'log-level-debug'; // Use a representative color for the level label
            }
            const color = TOKEN_COLOR_MAP.get(tokenName);
            if (color) {
                label.style.setProperty('--checkbox-color', `#${color}`);
                label.style.color = `#${color}`;
            }

            label.appendChild(checkbox);
            label.appendChild(customCheckbox);
            label.appendChild(document.createTextNode(` ${shortName}`));
            container.appendChild(label);
        });

        container.addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') {
                refreshViews();
            }
        });
    }

    function parseLogTemplate(template) {
        const partRegex = /^(.*)\$\{([a-zA-Z0-9_]+)\}(.*)$/;
        templateTokens = template.split(' ').map(chunk => {
            const match = chunk.match(partRegex);
            if (!match) throw new Error(`Invalid template chunk: "${chunk}"`);
            return {
                partName: match[2],
                prefix: match[1],
                suffix: match[3],
            };
        });
    }

    function getShortName(name) {
        if (name.length <= 4) return name;
        const shortName = name[0] + name.substring(1).replace(/[aeiou]/g, '');
        if (shortName.length > 4) return shortName.substring(0, 4);
        if (shortName.length < 3 && name.length > 2) return name.substring(0, 3);
        return shortName;
    }

    function updateLineParser() {
        const regexString = '^' + templateTokens.map(token => {
            const prefix = token.prefix.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
            const suffix = token.suffix.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
            const isLastToken = templateTokens.indexOf(token) === templateTokens.length - 1;
            const content = isLastToken ? '(.*)' : '(.*?)';
            return `${prefix}${content}${suffix}`;
        }).join(' ');
        lineParserRegex = new RegExp(regexString);
    }

    function createLineReconstructor(partVisibility) {
        return (line) => {
            const match = line.match(lineParserRegex);
            if (!match) return line;

            const visibleParts = [];
            for (let i = 0; i < templateTokens.length; i++) {
                const token = templateTokens[i];
                if (partVisibility[token.partName]) {
                    const capturedValue = match[i + 1];
                    visibleParts.push(token.prefix + capturedValue + token.suffix);
                }
            }
            return visibleParts.join(' ');
        };
    }

    function updateLanguageAndContent(editor, partVisibility, newContent) {
        languageCounter++;
        const newLanguageId = `hero-log-${languageCounter}`;

        const actions = [];
        let regexStr = '^';
        const visibleTokens = templateTokens.filter(token => partVisibility[token.partName]);

        if (visibleTokens.length > 0) {
            for (let i = 0; i < visibleTokens.length; i++) {
                const token = visibleTokens[i];
                const prefix = token.prefix.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
                const suffix = token.suffix.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&');
                
                regexStr += `(${prefix}.*?${suffix})`;
                
                if (token.partName === 'level') {
                    actions.push({
                        cases: {
                            '~^.*\\[(error|fatal|exception|severe)\\].*$': 'log-level-error',
                            '~^.*\\[(warn|warning)\\].*$': 'log-level-warn',
                            '~^.*\\[(info)\\].*$': 'log-level-info',
                            '~^.*\\[(debug)\\].*$': 'log-level-debug',
                            '~^.*\\[(trace)\\].*$': 'log-level-trace',
                            '@default': `log-part-${token.partName}`,
                        }
                    });
                } else {
                    actions.push(`log-part-${token.partName}`);
                }
                
                if (i < visibleTokens.length - 1) {
                    regexStr += '( )';
                    actions.push('log-literal');
                }
            }
        }

        monaco.languages.register({ id: newLanguageId });
        monaco.languages.setMonarchTokensProvider(newLanguageId, {
            ignoreCase: true,
            tokenizer: {
                root: visibleTokens.length > 0 ? [[new RegExp(regexStr), actions], [/.*/, 'log-part-message']] : []
            }
        });

        const model = editor.getModel();
        monaco.editor.setModelLanguage(model, newLanguageId);

        if (model.getValue() !== newContent) {
            model.setValue(newContent);
        }
    }

    function getPartVisibility(containerId) {
        const visibility = {};
        document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
            visibility[cb.dataset.part] = cb.checked;
        });
        return visibility;
    }

    function refreshViews() {
        if (!rawLogLines.length) return;

        // Handle Main View
        const mainPartVisibility = getPartVisibility('logPartsContainer');
        const mainLineReconstructor = createLineReconstructor(mainPartVisibility);
        const newMainContent = rawLogLines.map(mainLineReconstructor).join('\n');
        updateLanguageAndContent(mainEditor, mainPartVisibility, newMainContent);

        // Handle Filter View
        const filterPartVisibility = getPartVisibility('filterLogPartsContainer');
        const filterLineReconstructor = createLineReconstructor(filterPartVisibility);
        
        const query = document.getElementById('searchInput').value.trim();
        document.getElementById('searchInput').classList.toggle('active-filter', !!query);

        filteredDataMap = [];
        let newFilteredContent = "";
        let filteredRawLines = [];

        if (query) {
            let regex;
            const regexMatch = query.match(/^\/(.*)\/([i]?)$/);
            if (regexMatch) {
                try { regex = new RegExp(regexMatch[1], regexMatch[2] || ''); } catch (e) { regex = null; }
            } else {
                regex = new RegExp(query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'i');
            }

            if (regex) {
                for (let i = 0; i < rawLogLines.length; i++) {
                    if (regex.test(rawLogLines[i])) {
                        filteredRawLines.push(rawLogLines[i]);
                        filteredDataMap.push({ text: rawLogLines[i], originalLineNumber: i + 1 });
                    }
                }
            }
        }
        
        newFilteredContent = filteredRawLines.map(filterLineReconstructor).join('\n');
        updateLanguageAndContent(filterEditor, filterPartVisibility, newFilteredContent || (query ? "No results found." : "Filtered results will appear here."));
    }

    function setupSplitterDrag() {
        const splitter = document.getElementById('splitter');
        const mainView = document.getElementById('mainView');
        const splitContainer = document.getElementById('splitContainer');
        let isDragging = false;

        splitter.addEventListener('mousedown', () => {
            isDragging = true;
            splitter.classList.add('dragging');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerRect = splitContainer.getBoundingClientRect();
            let newMainHeight = e.clientY - containerRect.top;
            const minHeight = 100;
            if (newMainHeight < minHeight) newMainHeight = minHeight;
            if (newMainHeight > containerRect.height - minHeight) newMainHeight = containerRect.height - minHeight;
            const percentage = (newMainHeight / containerRect.height) * 100;
            mainView.style.flex = `0 0 ${percentage}%`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            splitter.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            rawLogLines = ev.target.result.split(/\r?\n/);
            mainEditor.setModel(monaco.editor.createModel(""));
            filterEditor.setModel(monaco.editor.createModel(""));
            refreshViews();
        };
        reader.readAsText(file);
    }

    function handleSearch(e) {
        if (e.key === 'Enter') refreshViews();
    }

    function setupEditorSync() {
        mainEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const originalLine = e.position.lineNumber;
            const filterIdx = filteredDataMap.findIndex(item => item.originalLineNumber === originalLine);
            if (filterIdx !== -1) {
                isSyncing = true;
                const targetLine = filterIdx + 1;
                filterEditor.revealLineInCenter(targetLine, monaco.editor.ScrollType.Immediate);
                filterEditor.setPosition({ lineNumber: targetLine, column: 1 });
                setTimeout(() => isSyncing = false, 50);
            }
        });

        filterEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const mapping = filteredDataMap[e.position.lineNumber - 1];
            if (mapping) {
                isSyncing = true;
                mainEditor.revealLineInCenter(mapping.originalLineNumber, monaco.editor.ScrollType.Immediate);
                mainEditor.setPosition({ lineNumber: mapping.originalLineNumber, column: 1 });
                setTimeout(() => isSyncing = false, 50);
            }
        });
    }
</script>
</body>
</html>
