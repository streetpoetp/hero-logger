<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hero.LogViewer</title>
    <style>
        :root {
            --bg-charcoal: #1e1e1e;
            --bg-charcoal-secondary: #2c2c2e;
            --bg-control: #3c3c3e;
            --text-off-white: #dcdcdc;
            --accent-sky-blue: #569cd6;
            --accent-soft-coral: #f47067;
            --accent-gray: #808080;
        }

        body {
            margin: 0; background: var(--bg-charcoal); color: var(--text-off-white);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px; display: flex; flex-direction: column; height: 100vh;
            overflow: hidden;
        }

        /* Dark Scrollbar */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-charcoal-secondary); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--bg-control);
            border-radius: 6px;
            border: 2px solid var(--bg-charcoal-secondary);
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #4a4a4a; }

        .split-container {
            display: flex; flex-direction: column; flex: 1; min-height: 0;
        }

        .view-pane {
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        #mainView { flex: 1 1 50%; }
        #filterView { flex: 1 1 50%; background: var(--bg-charcoal-secondary); }

        /* Toolbar */
        .toolbar {
            height: 36px; background: var(--bg-charcoal-secondary); display: flex; align-items: center;
            gap: 12px; padding: 0 12px; border-bottom: 1px solid #000; flex-shrink: 0;
            z-index: 20;
        }
        
        #mainView .toolbar {
            background: var(--bg-charcoal);
        }

        .editor-container { flex: 1; width: 100%; min-height: 0; }

        button, input {
            background: var(--bg-control); color: var(--text-off-white); border: 1px solid #000;
            padding: 5px 10px; border-radius: 2px; font-family: inherit; font-size: 14px;
        }

        #fileInput { width: 220px; }

        #logPartsContainer {
            display: flex; align-items: center; gap: 10px;
        }
        #logPartsContainer label {
            display: flex; align-items: center; gap: 4px; cursor: pointer;
            text-transform: capitalize;
        }

        /* Stretches the search input to take the rest of the space */
        #searchInput { flex: 1; min-width: 200px; }
        #searchInput:focus { outline: 1px solid var(--accent-sky-blue); border-color: var(--accent-sky-blue); }
        #searchInput.active-filter { color: var(--accent-sky-blue); font-weight: bold; border-color: var(--accent-sky-blue); }

        .splitter {
            height: 8px; background: #000; cursor: row-resize; flex-shrink: 0;
            transition: background 0.2s; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .splitter::after {
            content: "•••"; color: var(--accent-gray); letter-spacing: 2px; font-size: 10px;
        }
        .splitter:hover, .splitter.dragging { background: var(--accent-sky-blue); }
    </style>
</head>
<body>

<div class="split-container" id="splitContainer">
    <!-- Top Pane: Full Log -->
    <div id="mainView" class="view-pane">
        <div class="toolbar">
            <input type="file" id="fileInput">
            <div id="logPartsContainer"></div>
        </div>
        <div id="mainEditorContainer" class="editor-container"></div>
    </div>

    <!-- Drag Handle -->
    <div class="splitter" id="splitter"></div>

    <!-- Bottom Pane: Filter & Controls -->
    <div id="filterView" class="view-pane">
        <div class="toolbar">
            <input id="searchInput" placeholder="Search / Filter (Regex supported: /ERROR|WARN/i) - Press Enter to apply">
        </div>
        <div id="filterEditorContainer" class="editor-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs/loader.js"></script>

<script>
    /** 
     * USER CUSTOMIZATION: EDIT THIS TEMPLATE
     * This template is the single source of truth for the log format.
     * The checkboxes and the parser are derived from it.
     */
    const LOG_FORMAT_TEMPLATE = "${timestamp} [${level}] [${thread}] ${logger} ${message}";

    let mainEditor, filterEditor;
    let rawLogLines = [], filteredDataMap = [];
    let isSyncing = false, languageCounter = 0;
    let currentLanguageId = 'hero-log-0';
    let templateTokens;

    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.34.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        
        monaco.editor.defineTheme('riderIslandsDark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
                { token: 'log-part-timestamp', foreground: '808080' },
                { token: 'log-part-thread', foreground: '80b0c0' },
                { token: 'log-part-logger', foreground: '40a080' },
                { token: 'log-level-error', foreground: 'd06050', fontStyle: 'bold' },
                { token: 'log-level-warn', foreground: 'b08060', fontStyle: 'bold' },
                { token: 'log-level-info', foreground: '4080b0' },
                { token: 'log-level-debug', foreground: '90b080' },
                { token: 'log-level-trace', foreground: 'a070a0' },
                { token: 'log-part-level', foreground: 'c0c0c0' },
                { token: 'log-part-message', foreground: 'c0c0c0' },
                { token: 'log-literal', foreground: '555555' },
                { token: 'log-part-hidden', foreground: '1e1e1e' } // This makes the token invisible
            ],
            colors: {
                'editor.background': '#1e1e1e',
                'editor.foreground': '#dcdcdc',
                'editorCursor.foreground': '#aeafad',
                'editor.lineHighlightBackground': '#2d3032',
                'editor.lineHighlightBorder': '#3a3d41',
                'editor.selectionBackground': '#3a3d41',
                'editor.selectionHighlightBackground': '#264f78',
                'editorWidget.background': '#252526',
                'editorWidget.border': '#569cd6',
                'scrollbarSlider.background': '#3c3c3e',
                'scrollbarSlider.hoverBackground': '#4a4a4a',
            }
        });
        monaco.editor.setTheme('riderIslandsDark');

        const commonEditorOptions = {
            readOnly: true, domReadOnly: true,
            fontFamily: '"Consolas", "Courier New", monospace', fontSize: 14,
            lineNumbers: 'on', scrollBeyondLastLine: false, wordWrap: 'on',
            minimap: { enabled: false }, renderLineHighlight: 'all',
            renderLineHighlightOnlyWhenFocus: false, automaticLayout: true 
        };

        initializeFormattingControls();

        mainEditor = monaco.editor.create(document.getElementById('mainEditorContainer'), { ...commonEditorOptions, model: monaco.editor.createModel("Hero.LogViewer: Please select a file to begin.", currentLanguageId) });
        filterEditor = monaco.editor.create(document.getElementById('filterEditorContainer'), { ...commonEditorOptions, model: monaco.editor.createModel("Filtered results will appear here.", currentLanguageId) });

        document.getElementById('fileInput').addEventListener('change', handleFile);
        document.getElementById('searchInput').addEventListener('keydown', handleSearch);
        
        setupEditorSync();
        setupSplitterDrag();
    });

    function initializeFormattingControls() {
        templateTokens = parseLogTemplate(LOG_FORMAT_TEMPLATE);
        createToggleCheckboxes(templateTokens);
        document.getElementById('logPartsContainer').addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') updateLanguageDefinition();
        });
        updateLanguageDefinition();
    }

    function parseLogTemplate(template) {
        const tokens = [];
        const regex = /\$\{([a-zA-Z0-9_]+)\}/g;
        let lastIndex = 0;
        let match;
        while ((match = regex.exec(template)) !== null) {
            if (match.index > lastIndex) {
                tokens.push({ type: 'literal', value: template.substring(lastIndex, match.index) });
            }
            tokens.push({ type: 'part', value: match[1] });
            lastIndex = regex.lastIndex;
        }
        if (lastIndex < template.length) {
            tokens.push({ type: 'literal', value: template.substring(lastIndex) });
        }
        return tokens;
    }

    function createToggleCheckboxes(tokens) {
        const container = document.getElementById('logPartsContainer');
        container.innerHTML = '';
        tokens.filter(t => t.type === 'part').forEach(partToken => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.dataset.part = partToken.value;
            checkbox.checked = true;
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(` ${partToken.value}`));
            container.appendChild(label);
        });
    }

    function updateLanguageDefinition() {
        const partVisibility = {};
        document.querySelectorAll('#logPartsContainer input[type="checkbox"]').forEach(cb => {
            partVisibility[cb.dataset.part] = cb.checked;
        });

        let regexStr = '^';
        const actions = [];
        
        for (let i = 0; i < templateTokens.length; i++) {
            const token = templateTokens[i];
            const isVisible = token.type === 'literal' || partVisibility[token.value];
            
            if (token.type === 'part') {
                const isLastPart = i === templateTokens.length - 1 || !templateTokens.slice(i + 1).some(t => t.type === 'part');
                regexStr += isLastPart ? '(.*)' : '(.*?)';

                if (partVisibility[token.value]) {
                    if (token.value === 'level') {
                        actions.push({
                            cases: {
                                '~^\\s*(error|fatal|exception|severe)\\s*$': 'log-level-error',
                                '~^\\s*(warn|warning)\\s*$': 'log-level-warn',
                                '~^\\s*info\\s*$': 'log-level-info',
                                '~^\\s*debug\\s*$': 'log-level-debug',
                                '~^\\s*trace\\s*$': 'log-level-trace',
                                '@default': 'log-part-level',
                            }
                        });
                    } else {
                        actions.push(`log-part-${token.value}`);
                    }
                } else {
                    actions.push('log-part-hidden');
                }
            } else { // Literal
                const prevPart = i > 0 ? templateTokens[i-1] : null;
                const nextPart = i < templateTokens.length - 1 ? templateTokens[i+1] : null;
                const isPrevPartVisible = prevPart && prevPart.type === 'part' && partVisibility[prevPart.value];
                const isNextPartVisible = nextPart && nextPart.type === 'part' && partVisibility[nextPart.value];

                regexStr += `(${token.value.replace(/[.*+?^$()[\]{}|\\]/g, '\\$&')})`;
                
                if (isPrevPartVisible && isNextPartVisible) {
                    actions.push('log-literal');
                } else {
                    actions.push('log-part-hidden');
                }
            }
        }

        languageCounter++;
        currentLanguageId = `hero-log-${languageCounter}`;
        monaco.languages.register({ id: currentLanguageId });
        monaco.languages.setMonarchTokensProvider(currentLanguageId, {
            ignoreCase: true,
            tokenizer: {
                root: [
                    [new RegExp(regexStr), actions],
                    [/.+/, 'log-part-message'] 
                ]
            }
        });

        if (mainEditor && mainEditor.getModel()) monaco.editor.setModelLanguage(mainEditor.getModel(), currentLanguageId);
        if (filterEditor && filterEditor.getModel()) monaco.editor.setModelLanguage(filterEditor.getModel(), currentLanguageId);
    }

    function setupSplitterDrag() {
        const splitter = document.getElementById('splitter');
        const mainView = document.getElementById('mainView');
        const splitContainer = document.getElementById('splitContainer');
        let isDragging = false;

        splitter.addEventListener('mousedown', () => {
            isDragging = true;
            splitter.classList.add('dragging');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const containerRect = splitContainer.getBoundingClientRect();
            let newMainHeight = e.clientY - containerRect.top;
            const minHeight = 100;
            if (newMainHeight < minHeight) newMainHeight = minHeight;
            if (newMainHeight > containerRect.height - minHeight) newMainHeight = containerRect.height - minHeight;
            const percentage = (newMainHeight / containerRect.height) * 100;
            mainView.style.flex = `0 0 ${percentage}%`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            splitter.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });
    }

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            rawLogLines = ev.target.result.split(/\r?\n/);
            mainEditor.setModel(monaco.editor.createModel(ev.target.result, currentLanguageId));
            applyFilter();
        };
        reader.readAsText(file);
    }

    function handleSearch(e) {
        if (e.key === 'Enter') applyFilter();
    }

    function applyFilter() {
        const query = document.getElementById('searchInput').value.trim();
        document.getElementById('searchInput').classList.toggle('active-filter', !!query);

        filteredDataMap = [];
        if (!query) {
            filterEditor.setModel(monaco.editor.createModel("", currentLanguageId));
            return;
        }

        let regex;
        const regexMatch = query.match(/^\/(.*)\/([i]?)$/);
        if (regexMatch) {
            try { regex = new RegExp(regexMatch[1], regexMatch[2] || ''); } catch (e) { regex = null; }
        } else {
            regex = new RegExp(query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'i');
        }

        if (!regex) return;

        const filteredLines = [];
        for (let i = 0; i < rawLogLines.length; i++) {
            const line = rawLogLines[i];
            if (regex.test(line)) {
                filteredLines.push(line);
                filteredDataMap.push({ text: line, originalLineNumber: i + 1 });
            }
        }
        filterEditor.setModel(monaco.editor.createModel(filteredLines.join('\n'), currentLanguageId));
    }

    function setupEditorSync() {
        mainEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const originalLine = e.position.lineNumber;
            const filterIdx = filteredDataMap.findIndex(item => item.originalLineNumber === originalLine);
            if (filterIdx !== -1) {
                isSyncing = true;
                const targetLine = filterIdx + 1;
                filterEditor.revealLineInCenter(targetLine, monaco.editor.ScrollType.Immediate);
                filterEditor.setPosition({ lineNumber: targetLine, column: 1 });
                isSyncing = false;
            }
        });

        filterEditor.onDidChangeCursorPosition(e => {
            if (isSyncing || e.reason !== monaco.editor.CursorChangeReason.Explicit) return;
            const mapping = filteredDataMap[e.position.lineNumber - 1];
            if (mapping) {
                isSyncing = true;
                mainEditor.revealLineInCenter(mapping.originalLineNumber, monaco.editor.ScrollType.Immediate);
                mainEditor.setPosition({ lineNumber: mapping.originalLineNumber, column: 1 });
                isSyncing = false;
            }
        });
    }
</script>
</body>
</html>
